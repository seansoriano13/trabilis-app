services:
  - type: web
    name: trabilis-backend
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: AMADEUS_API_KEY
        sync: false
      - key: AMADEUS_API_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: TINIFY_API_KEY
        sync: false
      - key: IMG_BB_API_KEY
        sync: false
      - key: IMG_BB_API_URL
        value: https://api.imgbb.com/1/upload
      - key: PUSHER_APP_ID
        sync: false
      - key: PUSHER_APP_KEY
        sync: false
      - key: PUSHER_APP_SECRET
        sync: false
      - key: PUSHER_APP_CLUSTER
        sync: false
      - key: DAILY_BOOKING_LIMIT
        value: 50
      - key: UNTICKETED_BOOKING_LIMIT
        value: 100
      - key: AUTO_PAUSE_THRESHOLD
        value: 80
      - key: CRITICAL_THRESHOLD
        value: 90
      - key: SUPPORT_EMAIL
        sync: false
      - key: SUPPORT_PHONE
        value: 9296106660
      - key: TEST_EMAIL
        sync: false
